name: Build Test APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build FDROID Release APK
        # We use --no-daemon to ensure stability on GitHub runners
        # We build the fdroidRelease variant which has NO Google services
        run: ./gradlew assembleFdroidRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyEasyNotes-FDROID-Test
          path: app/build/outputs/apk/fdroid/release/*.apk
