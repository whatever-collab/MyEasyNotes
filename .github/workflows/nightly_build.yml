name: Simple FDROID Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fix Package Imports
        # Automatically replaces old package imports with our new namespace
        run: |
          find app/src -name "*.kt" -type f -exec sed -i 's/import com\.kin\.easynotes\.R/import com.whatevercollab.myeasynotes.R/g' {} +

      - name: Build FDROID Release APK
        # Builds the fdroid flavor which excludes Google services
        run: ./gradlew assembleFdroidRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyEasyNotes-FDROID-Test
          path: app/build/outputs/apk/fdroid/release/*.apk
