name: Simple FDROID Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean Previous Builds
        # Ensures no cached errors interfere
        run: ./gradlew clean --no-daemon

      - name: Fix Package Imports Aggressively
        # Replaces ALL instances of the old R import with the new one
        run: |
          find app/src -type f -name "*.kt" -exec sed -i 's/import com\.kin\.easynotes\.R/import com.whatevercollab.myeasynotes.R/g' {} +
          # Also check for any accidental android.R imports which can cause confusion
          find app/src -type f -name "*.kt" -exec sed -i 's/import android\.R$/import com.whatevercollab.myeasynotes.R/g' {} +

      - name: Verify Imports Changed
        # This step will fail if there are still old imports left, helping us debug
        run: |
          if grep -r "import com\.kin\.easynotes\.R" app/src; then
            echo "ERROR: Old imports still exist!"
            exit 1
          fi

      - name: Build FDROID Release APK
        # Builds the fdroid flavor which excludes Google services
        run: ./gradlew assembleFdroidRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyEasyNotes-FDROID-Test
          path: app/build/outputs/apk/fdroid/release/*.apk
